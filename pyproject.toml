[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecup"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3,<3",
    "polars>=1.43.2",
    "python-dotenv>=1.2.2",
    "mlflow==3.5.1",
    "ipykernel>=7.3.0",
    "transformers>=5.15.0",
    "torch==2.11.0",
    "peft>=0.20.0",
    "torchao>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "ipykernel",
    "scikit-learn>=1.6",
]
train = [
    "torch",
    "transformers",
    "sentence-transformers",
    "tqdm",
    "joblib",
]

[tool.ecup.data]
data_repo = "well-please/ecup-data"
items = "items.parquet"
items_human = "items_human.parquet"
matches = "matches.parquet"
matches_llm = "matches_llm.parquet"

[tool.ecup.model]
student_name = "well-please/student_model"
teacher_name = "well-please/teacher_model"
tokenizer_name = "well-please/teacher_model"
seed = 69
teacher_epochs = 2
student_epochs = 2
teacher_batch = 128
student_batch = 224
inference_batch = 512
alpha = 0.5

# Fine-tuning (student v8)
model_name = "well-please/student_model"
model_lora_r = 64
model_lora_alpha = 128
model_lora_dropout = 0.05
model_lora_layers = "5-12"
model_lora_modules = "clf,query,key,value,dense"
train_batch = 128
eval_batch = 256
train_epochs = 2
lr = 5e-4
max_len = 320
test_size = 0.2
symmetry_prob = 0.3
llm_sample_size = 200000
label_smoothing = 0.05
llm_fill_weight = 0.5

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["utility"]
