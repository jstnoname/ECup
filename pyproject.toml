[project]
name = "ecup"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3,<3",
    "polars>=1.0",
    "python-dotenv>=1.2.2",
    "mlflow==3.5.1",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "ipykernel",
]

[tool.ecup.data]
data_repo = "well-please/ecup-data"
items = "items.parquet"
items_human = "items_human.parquet"
matches = "matches.parquet"
matches_llm = "matches_llm.parquet"

[tool.ecup.model]
# параметры обучения появятся перед 02_train (model_name, epochs, lr, веса...)
