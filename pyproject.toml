[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecup"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3,<3",
    "polars>=1.43.2",
    "numpy",
    "python-dotenv>=1.2.2",
    "mlflow==3.5.1",
    "ipykernel>=7.3.0",
    "transformers>=5.15.0",
    "torch==2.11.0",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "ipykernel",
    "scikit-learn>=1.6",
]
train = [
    "torch",
    "transformers",
    "sentence-transformers",
    "tqdm",
    "joblib",
]

[tool.ecup.data]
data_repo = "well-please/ecup-data"
items = "items.parquet"
items_human = "items_human.parquet"
matches = "matches.parquet"
matches_llm = "matches_llm.parquet"

[tool.ecup.model]
student_name = "ai-forever/ruBert-base"
teacher_name = "ai-forever/sbert_large_mt_nlu_ru"
tokenizer_name = "ai-forever/sbert_large_mt_nlu_ru"
seed = 69
epochs = 2
batch_size = 16
lr = 1e-5
max_len = 256
alpha = 0.5
llm_weight = 0.2
temperature = 1.0
test_size = 0.2
infer_batch_size = 512

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["utility"]
